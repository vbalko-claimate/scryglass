<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scryglass Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#overlay {
    position: fixed;
    top: 8px; left: 8px;
    width: 340px;
    cursor: default;
    padding: 12px 14px;
    background: rgba(12, 12, 18, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    color: rgba(240, 238, 230, 0.95);
    transition: opacity 0.15s ease-out;
}

#overlay.hidden { opacity: 0; pointer-events: none; }
#overlay.compact { padding: 6px 10px; }
#overlay.dragging { cursor: grabbing; }

/* Peek: hover over the panel (or a key shortcut / native cursor-forward) collapses
   it to a small legible pill so it stops covering the board (e.g. the opponent
   name), then springs back when the cursor leaves. The JS hit-test caches the
   full-size box (see overlayCursor), so shrinking the layout here can't flicker. */
#peek-pill { display: none; }
#overlay.peek { width: auto; padding: 5px 10px; }
/* !important: some children (#key-play, #debrief) carry an inline display set by
   JS, which would otherwise win over this rule and stop the panel collapsing. */
#overlay.peek > :not(#peek-pill) { display: none !important; }
#overlay.peek > #peek-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(240, 238, 230, 0.92);
    white-space: nowrap;
    animation: peek-pop 0.2s cubic-bezier(0.34, 1.4, 0.5, 1);
}
#peek-pill .peek-pill-label { font-weight: 500; opacity: 0.7; letter-spacing: 0.02em; }
@keyframes peek-pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Opponent line */
.opp-line {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: rgba(200, 198, 190, 0.8);
    margin-bottom: 6px;
    min-height: 18px;
}
.opp-deck {
    font-weight: 600;
    color: rgba(240, 238, 230, 0.95);
}
.opp-conf {
    font-size: 10px;
    color: rgba(160, 158, 150, 0.6);
}
.opp-conf.high { color: #81c784; }
.opp-conf.mid { color: #ffc107; }
.opp-conf.low { color: rgba(160, 158, 150, 0.5); }

/* Key play */
.key-play {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    min-height: 22px;
}
.key-play-indicator {
    width: 3px;
    min-height: 18px;
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
}
.key-play-indicator.critical { background: #E63946; }
.key-play-indicator.high { background: #F4A261; }
.key-play-indicator.medium { background: #6C9A8B; }
.key-play-indicator.low { background: rgba(139, 139, 153, 0.5); }

/* Opponent turn — muted intel style */
#overlay.opp-turn .key-play-indicator { background: #4a6fa5; }
#overlay.opp-turn .key-play-card { font-weight: 500; color: rgba(230, 232, 240, 0.9); }
#overlay.opp-turn .key-play-action { color: rgba(160, 170, 190, 0.7); }
#overlay.opp-turn .key-play-reason { font-style: italic; }

.key-play-content {
    display: flex;
    flex-direction: column;
    gap: 1px;
}
.key-play-action {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.key-play-action.act-cast   { color: #f0b429; }
.key-play-action.act-attack { color: #e8443a; }
.key-play-action.act-block  { color: #3b82f6; }
.key-play-action.act-hold   { color: #94a3b8; }
.key-play-action.act-target { color: #d946ef; }
.key-play-actionline { display: flex; align-items: center; gap: 6px; }
.key-play-source {
    font-size: 0.62em;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 1px 5px;
    border-radius: 3px;
    color: #0b1e1a;
    background: #2dd4bf;
    text-transform: uppercase;
}
/* Async rollout-refinement badge: search confirmed vs changed the instant pick */
.key-play-refined {
    font-size: 0.62em;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
}
.key-play-refined.confirmed { color: #0b1e1a; background: #81c784; }
.key-play-refined.changed   { color: #1a1a2e; background: #f4a261; }
.key-play-card {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}
.key-play-reason {
    font-size: 13px;
    font-weight: 400;
    line-height: 1.3;
    color: rgba(200, 198, 190, 0.7);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* Honest degradation: advisor can't see part of the hand (off-catalog cards) */
.advice-confidence {
    margin: 4px 0 0 11px; /* align under the key-play content (indicator 3px + gap 8px) */
    font-size: 11px;
    line-height: 1.3;
    color: #f4a261;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Threat warning */
.threat-line {
    font-size: 13px;
    color: #F4A261;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: none;
}
.threat-line.visible { display: block; }

/* Phase indicator */
.phase-line {
    font-size: 10px;
    color: rgba(160, 158, 150, 0.4);
    margin-top: 4px;
    text-align: right;
}

/* Do Now (expandable) */
.do-now {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: none;
}
.do-now.visible { display: block; }
.do-now-item {
    font-size: 13px;
    color: rgba(200, 198, 190, 0.7);
    padding: 2px 0;
    padding-left: 11px;
    position: relative;
}
.do-now-item::before {
    content: '·';
    position: absolute;
    left: 3px;
    color: rgba(160, 158, 150, 0.4);
}

/* Feedback buttons — hidden by default, shown in interactive mode */
.feedback-btns {
    display: none;
    gap: 6px;
    margin-top: 4px;
    margin-left: 11px;
}
.feedback-btns.visible { display: flex; }

.fb-btn {
    width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: rgba(30, 30, 40, 0.85);
    cursor: pointer;
    font-size: 13px;
    line-height: 28px;
    text-align: center;
    transition: background 0.1s, transform 0.1s;
}
.fb-btn:hover {
    background: rgba(60, 60, 80, 0.95);
    transform: scale(1.15);
}
.fb-btn:active { transform: scale(0.95); }
.fb-btn.good { color: #81c784; }
.fb-btn.bad { color: #ef5350; }
.fb-btn.flag { color: #ffb74d; }
.fb-btn.sent {
    opacity: 0.3;
    pointer-events: none;
}

/* Interactive mode indicator */
#interactive-indicator {
    display: none;
    font-size: 9px;
    color: rgba(255, 200, 50, 0.7);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 4px;
    text-align: right;
}
#interactive-indicator.visible { display: block; }

/* Feedback flash confirmation */
#overlay.feedback-good { border-color: rgba(129, 199, 132, 0.5); }
#overlay.feedback-bad { border-color: rgba(239, 83, 80, 0.5); }

/* Hint line */
.hint-line {
    font-size: 9px;
    color: rgba(244, 162, 97, 0.6);
    margin-top: 6px;
    padding-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    text-align: right;
    animation: hint-pulse 10s ease-in-out infinite;
}

@keyframes hint-pulse {
    0%, 84%, 100% { opacity: 1; }
    87% { opacity: 1.0; color: rgba(244, 162, 97, 0.9); }
    91% { opacity: 0.2; }
    95% { opacity: 0.2; }
    98% { opacity: 1; }
}

/* No match — completely invisible (background too) */
#overlay.no-match {
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-color: transparent !important;
}
#overlay.no-match * {
    visibility: hidden;
}

.waiting {
    font-size: 11px;
    color: rgba(160, 158, 150, 0.4);
    font-style: italic;
}

/* Loud lethal warning — the "you're about to die" banner. */
.lethal-banner {
    display: none;
    margin: 0 0 6px 0;
    padding: 7px 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(200, 20, 30, 0.96), rgba(150, 10, 20, 0.96));
    border: 1px solid #ff5a66;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    box-shadow: 0 0 14px rgba(233, 57, 70, 0.55);
    animation: lethal-pulse 1.1s ease-in-out infinite;
}
.lethal-banner.visible { display: block; }
.lethal-banner .lethal-tag { font-size: 12px; opacity: 0.95; margin-right: 6px; }
@keyframes lethal-pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(233, 57, 70, 0.45); }
    50%      { box-shadow: 0 0 20px rgba(255, 90, 102, 0.85); }
}
/* Combo / big-swing banner — "you're building a combo" (main-phase payoff). */
.combo-banner {
    display: none;
    margin: 0 0 6px 0;
    padding: 7px 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(30, 140, 90, 0.96), rgba(20, 110, 70, 0.96));
    border: 1px solid #4fd18a;
    color: #eafff3;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 14px rgba(79, 209, 138, 0.5);
    animation: combo-pulse 1.3s ease-in-out infinite;
}
.combo-banner.visible { display: block; }
.combo-banner .combo-tag { font-size: 12px; opacity: 0.95; margin-right: 6px; }
@keyframes combo-pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(79, 209, 138, 0.4); }
    50%      { box-shadow: 0 0 20px rgba(129, 199, 132, 0.8); }
}
/* Synergy / "part of a combo" teaching hint — quiet, for players learning a deck
   (overlay v2 WEAK tier). Deliberately understated vs the loud combo-banner so it
   never crowds the lethal/combo signals. */
.synergy-hint {
    display: none;
    margin: 0 0 6px 0;
    padding: 5px 10px;
    border-radius: 5px;
    background: rgba(30, 90, 70, 0.55);
    border: 1px solid rgba(90, 170, 140, 0.5);
    color: #cdeee0;
    font-size: 12px;
    font-weight: 500;
}
.synergy-hint.visible { display: block; }
.synergy-hint .synergy-tag { opacity: 0.9; margin-right: 5px; }
</style>
</head>
<body>
<div id="overlay" class="no-match">
    <div id="peek-pill">◈ <span class="peek-pill-label">Scryglass</span></div>
    <div class="opp-line" id="opp-line">
        <span class="waiting" id="waiting-msg">Waiting for match...</span>
    </div>
    <div class="lethal-banner" id="lethal-banner"></div>
    <div class="combo-banner" id="combo-banner"></div>
    <div class="synergy-hint" id="synergy-hint"></div>
    <div class="key-play" id="key-play" style="display:none">
        <div class="key-play-indicator medium" id="key-play-indicator"></div>
        <div class="key-play-content">
            <div class="key-play-actionline">
                <span class="key-play-action" id="key-play-action"></span>
                <span class="key-play-source" id="key-play-source" style="display:none">ENGINE</span>
                <span class="key-play-refined" id="key-play-refined" style="display:none"></span>
            </div>
            <div class="key-play-card" id="key-play-card"></div>
            <div class="key-play-reason" id="key-play-reason"></div>
        </div>
    </div>
    <div class="advice-confidence" id="advice-confidence" style="display:none"></div>
    <div class="threat-line" id="threat-line"></div>
    <div class="do-now" id="do-now"></div>
    <div class="phase-line" id="phase-line"></div>
    <div class="hint-line" id="hint-line">Left ⌘: feedback + drag to move · hover to hide</div>
    <div class="feedback-btns" id="feedback-btns">
        <div class="fb-btn good" onclick="sendFeedback('up')" title="Good advice">✓</div>
        <div class="fb-btn bad" onclick="sendFeedback('down')" title="Bad advice">✗</div>
        <div class="fb-btn flag" onclick="flagDecision(this)" title="Flag this decision — save the full game state to reproduce later">⚑</div>
    </div>
    <div id="interactive-indicator">FEEDBACK</div>
    <div id="debrief" style="display:none;text-align:center;padding:8px 0"></div>
</div>

<script>
let ws = null;
let currentStrategyInfo = null;
let isMyTurn = false;
let inMatch = false;

// Shared action family mappings
const FAMILY_TYPE = {
    cast_spell: 'cast', play_land: 'cast', activate: 'cast',
    attack: 'attack', block: 'block', pass: 'hold',
};
const FAMILY_LABEL = {
    cast_spell: 'CAST', play_land: 'PLAY LAND', activate: 'ACTIVATE',
    attack: 'ATTACK', block: 'BLOCK', pass: 'HOLD',
};

// Match-state driver. `/match-status` is the AUTHORITATIVE in-match signal
// (server-side, correct: true only while a match is in progress). Drive `inMatch`
// from it every 2s rather than from fragile WS events (which could leave the
// overlay stuck showing the session record IN a match, or blank). Manage the two
// views EXPLICITLY here instead of the `.no-match` "visibility:hidden *" hack —
// that also hid the between-match session record.
async function tick() {
    let active = inMatch;
    try {
        active = ((await (await fetch('/match-status')).json()).active === true);
    } catch (e) { return; /* engine not reachable — keep last state */ }
    inMatch = active;
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('no-match'); // never force-hide all; managed below
    const wm = document.getElementById('waiting-msg');
    if (active) {
        // In a match: the advisor panels render from WS (updateState/updateAdvice).
        if (wm) wm.style.display = 'none';
        return;
    }
    // Between matches: hide the advisor panels, show the session record.
    document.getElementById('key-play').style.display = 'none';
    document.getElementById('advice-confidence').style.display = 'none';
    document.getElementById('lethal-banner').classList.remove('visible');
    document.getElementById('combo-banner').classList.remove('visible');
    document.getElementById('do-now').classList.remove('visible');
    document.getElementById('threat-line').classList.remove('visible');
    document.getElementById('debrief').style.display = 'none';
    if (!wm) return;
    try {
        const s = await (await fetch('/api/session-stats')).json();
        const rec = s.record || {}, recent = s.recent || {}, last = s.last;
        let t = `Record ${rec.wins||0}-${rec.losses||0} (${rec.pct||0}%)`;
        if (((recent.wins||0)+(recent.losses||0)) > 0)
            t += ` | last 20: ${recent.wins||0}-${recent.losses||0}`;
        if (last && last.result)
            t += ` | last: ${last.result === 'Win' ? 'WIN' : 'LOSS'} vs ${last.opponent || '?'}`;
        wm.textContent = t;
        wm.style.display = '';
    } catch (e) { /* stats unavailable — leave text as-is */ }
}
setInterval(tick, 2000);

function connect() {
    ws = new WebSocket(`ws://${location.hostname}:8765/ws`);
    ws.onopen = () => {
        // Request current state (we might have missed earlier messages)
        ws.send(JSON.stringify({type: 'request_state'}));
        tick();
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => {};
    ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        switch (msg.type) {
            case 'state_update':
                updateState(msg.data);
                break;
            case 'advice':
                updateAdvice(msg.data);
                break;
            case 'strategy_info':
                currentStrategyInfo = msg.data;
                updateOppLine(msg.data);
                // Strategy info means a match is active
                if (msg.data && msg.data.strategy_name && !inMatch) {
                    inMatch = true;
                    document.getElementById('overlay').classList.remove('no-match');
                }
                break;
            case 'match_start':
                inMatch = true;
                document.getElementById('overlay').classList.remove('no-match');
                break;
            case 'match_end':
                inMatch = false;
                resetOverlay();
                showDebrief(msg.data);
                break;
        }
    };
}

function updateState(state) {
    const ti = state.turn || {};
    isMyTurn = ti.is_my_turn === true;
    const overlay = document.getElementById('overlay');

    // Show overlay if we get state updates (match is active)
    if (ti.number > 0 && !inMatch) {
        inMatch = true;
        overlay.classList.remove('no-match');
    }

    // Always show overlay — opponent turn shows intel, blocking expands fully
    const isBlocking = state.pending_request === 'GREMessageType_DeclareBlockersReq';
    overlay.classList.remove('compact');
    if (isMyTurn || isBlocking) {
        document.getElementById('do-now').classList.add('visible');
        overlay.classList.remove('opp-turn');
    } else {
        document.getElementById('do-now').classList.remove('visible');
        overlay.classList.add('opp-turn');
    }

    // Phase line
    const phase = ti.phase_display || '';
    const turnNum = ti.number || '';
    if (turnNum) {
        document.getElementById('phase-line').textContent =
            `T${turnNum} · ${phase} · ${isMyTurn ? 'Your turn' : 'Opp turn'}`;
    }
}

function updateOppLine(info) {
    const el = document.getElementById('opp-line');
    const waitMsg = document.getElementById('waiting-msg');

    if (info && info.opp_deck) {
        const conf = info.opp_confidence || 0;
        const confClass = conf >= 80 ? 'high' : conf >= 50 ? 'mid' : 'low';
        waitMsg.style.display = 'none';
        el.innerHTML = `<span class="opp-deck">${info.opp_deck}</span>`
            + `<span class="opp-conf ${confClass}">${conf}%</span>`;
    } else if (info && info.strategy_name) {
        waitMsg.style.display = 'none';
        el.innerHTML = `<span class="opp-deck">${info.strategy_name}</span>`;
    } else {
        waitMsg.style.display = '';
        waitMsg.textContent = 'Waiting for match...';
    }
}

function updateAdvice(data) {
    const items = data.items || data || [];
    lastAdvice = items;
    if (!items.length) return;

    // Advice means match is active
    if (!inMatch) {
        inMatch = true;
        document.getElementById('overlay').classList.remove('no-match');
    }

    // Find spotlight (highest priority with action_scores)
    const priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };
    const sorted = [...items].sort((a, b) => {
        const pa = priorityOrder[a.priority] ?? 4;
        const pb = priorityOrder[b.priority] ?? 4;
        if (pa !== pb) return pa - pb;
        const sa = a.action_scores?.length ? Math.max(...a.action_scores.map(s => s.score)) : 0;
        const sb = b.action_scores?.length ? Math.max(...b.action_scores.map(s => s.score)) : 0;
        return sb - sa;
    });

    // Key play = first "now" item (heuristic or strategy, not intel)
    const nowItems = sorted.filter(a => a.source !== 'intel');
    const intelItems = sorted.filter(a => a.source === 'intel');

    const keyPlay = nowItems[0];
    if (keyPlay) {
        const el = document.getElementById('key-play');
        const indicator = document.getElementById('key-play-indicator');
        const actionEl = document.getElementById('key-play-action');
        const cardEl = document.getElementById('key-play-card');
        const reasonEl = document.getElementById('key-play-reason');

        el.style.display = 'flex';
        indicator.className = 'key-play-indicator ' + (keyPlay.priority || 'medium');

        // Source badge: mark when the spotlighted advice is from the
        // glass-engine /advise advisor (vs the original heuristic/strategy).
        const sourceEl = document.getElementById('key-play-source');
        if (sourceEl) {
            sourceEl.style.display = (keyPlay.source === 'engine') ? '' : 'none';
        }

        // Extract card name and action from structured data
        const scores = keyPlay.action_scores || [];
        const topScore = scores.find(s => s.target) || scores[0];
        const cardName = topScore?.target || '';
        const family = topScore?.family || '';
        const actionLabel = FAMILY_LABEL[family] || '';
        const actionCss = FAMILY_TYPE[family] || '';

        // Async-refinement badge: the rollout search either CONFIRMED the
        // instant heuristic pick or CHANGED it (server pushes a second advice
        // tagged refined:true + replaces=<the instant pick it supersedes>).
        // Instant (untagged) advice shows no badge.
        const refinedEl = document.getElementById('key-play-refined');
        if (refinedEl) {
            if (keyPlay.refined) {
                const changed = keyPlay.replaces && keyPlay.replaces !== cardName;
                refinedEl.textContent = changed ? '↻ refined' : '✓ verified';
                refinedEl.className = 'key-play-refined ' + (changed ? 'changed' : 'confirmed');
                refinedEl.style.display = '';
            } else {
                refinedEl.style.display = 'none';
            }
        }

        if (cardName) {
            // Structured: action label + big card name + reason
            actionEl.textContent = actionLabel;
            actionEl.className = 'key-play-action' + (actionCss ? ' act-' + actionCss : '');
            cardEl.textContent = cardName;
            // Strip card name from message to get clean reason
            let reason = keyPlay.message;
            if (cardName && reason.includes(cardName)) {
                reason = reason.replace(cardName, '').replace(/:\s*$/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
            }
            // Remove trailing mana cost like "(o1oW)"
            reason = reason.replace(/\s*\([o\dWUBRG]+\)\s*$/i, '').trim();
            reasonEl.textContent = reason;
            reasonEl.style.display = reason ? '' : 'none';
        } else {
            // Fallback: just show message
            actionEl.textContent = '';
            actionEl.className = 'key-play-action';
            cardEl.textContent = keyPlay.message;
            reasonEl.textContent = '';
            reasonEl.style.display = 'none';
        }
    }

    // Do now (next 2 items)
    const doNow = document.getElementById('do-now');
    const secondary = nowItems.slice(1, 4);
    if (secondary.length && isMyTurn) {
        doNow.classList.add('visible');
        doNow.innerHTML = secondary.map(a => {
            const s = (a.action_scores || []).find(s => s.target);
            if (s) {
                const name = s.target;
                // Bold the card name in the message
                const highlighted = a.message.replace(name, `<strong>${name}</strong>`);
                return `<div class="do-now-item">${highlighted}</div>`;
            }
            return `<div class="do-now-item">${a.message}</div>`;
        }).join('');
    } else {
        doNow.classList.remove('visible');
    }

    // Threat line (from intel)
    const threat = intelItems.find(a => a.priority === 'high' || a.priority === 'critical');
    const threatEl = document.getElementById('threat-line');
    if (threat) {
        threatEl.textContent = '⚠ ' + threat.message;
        threatEl.classList.add('visible');
    } else {
        threatEl.classList.remove('visible');
    }

    // Honest degradation: surface when the engine can't see part of the hand
    // (off-catalog cards drop confidence) so a blank/pass isn't mistaken for a
    // real recommendation. See the 2026-07-06 Marvel-blindness incident.
    const confEl = document.getElementById('advice-confidence');
    const engineItem = nowItems.find(a => a.source === 'engine') || nowItems[0];
    const conf = engineItem && engineItem.confidence;
    if (conf === 'low' || conf === 'directional') {
        confEl.textContent = '⚠ ' + (engineItem.confidence_basis
            || 'Some cards not recognized — advice may be incomplete');
        confEl.style.display = '';
    } else {
        confEl.style.display = 'none';
    }

    // Loud lethal banner — set by the blocker advisor when incoming ≥ life.
    const lethalEl = document.getElementById('lethal-banner');
    const alertMsg = (nowItems.find(a => typeof a.alert === 'string' && a.alert) || {}).alert;
    if (alertMsg) {
        lethalEl.innerHTML = '<span class="lethal-tag">☠</span>' + alertMsg;
        lethalEl.classList.add('visible');
    } else {
        lethalEl.classList.remove('visible');
    }

    // Combo / synergy — overlay v2 board-state detector. STRONG "combo" tier →
    // the loud pulsing banner (a sim-confirmed big swing you can execute); WEAK
    // "synergy" tier → a quiet teaching hint (a payoff/engine piece is present),
    // valuable for players learning a deck. Falls back to the legacy
    // per-recommendation `combo` string when the detector is silent.
    const comboEl = document.getElementById('combo-banner');
    const synEl = document.getElementById('synergy-hint');
    const synergies = nowItems.flatMap(a => Array.isArray(a.synergies) ? a.synergies : []);
    const strong = synergies.find(s => s && s.tier === 'combo');
    const weak = synergies.find(s => s && s.tier === 'synergy');
    const comboMsg = (strong && strong.message)
        || (nowItems.find(a => typeof a.combo === 'string' && a.combo) || {}).combo;
    if (comboMsg && isMyTurn) {
        comboEl.innerHTML = '<span class="combo-tag">⚡</span>' + comboMsg;
        comboEl.classList.add('visible');
    } else {
        comboEl.classList.remove('visible');
    }
    // Quiet WEAK hint only when there's no loud combo to avoid stacking banners.
    if (weak && weak.message && isMyTurn && !comboMsg) {
        synEl.innerHTML = '<span class="synergy-tag">🔧</span>' + weak.message;
        synEl.classList.add('visible');
    } else {
        synEl.classList.remove('visible');
    }
}

let lastAdvice = null;
let feedbackMode = false;
let feedbackAdviceSnapshot = null;

// Called by native overlay (Swift/Rust) when modifier key is pressed/released
function setInteractiveMode(active) {
    feedbackMode = active;
    cancelOverlayDrag();   // a drag can't survive a feedback-mode transition
    // Entering feedback mode: cancel any active peek so the ✓/✗/⚑ buttons aren't
    // stuck shrunk (the native cursor-forwarder is gated off while interactive, so
    // nothing else would clear it).
    if (active) setPeek(false);
    const btns = document.getElementById('feedback-btns');
    const indicator = document.getElementById('interactive-indicator');

    if (active && inMatch && lastAdvice && lastAdvice.length > 0) {
        // Snapshot current advice for race condition protection
        feedbackAdviceSnapshot = {
            decision_id: lastAdvice[0]?.decision_id || null,
            message: lastAdvice[0]?.message || '',
            timestamp: Date.now()
        };
        btns.classList.add('visible');
        indicator.classList.add('visible');
        // Reset sent state
        document.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('sent'));
    } else {
        btns.classList.remove('visible');
        indicator.classList.remove('visible');
        feedbackAdviceSnapshot = null;
    }
}

function sendFeedback(vote) {
    if (!ws || ws.readyState !== WebSocket.OPEN || !feedbackAdviceSnapshot) return;

    // Disable buttons
    document.querySelectorAll('.fb-btn').forEach(b => b.classList.add('sent'));

    ws.send(JSON.stringify({
        type: 'feedback',
        vote: vote,
        decision_id: feedbackAdviceSnapshot.decision_id,
        advice_text: feedbackAdviceSnapshot.message,
        snapshot_ts: feedbackAdviceSnapshot.timestamp
    }));

    // Visual confirmation flash
    const overlay = document.getElementById('overlay');
    const cls = vote === 'up' ? 'feedback-good' : 'feedback-bad';
    overlay.classList.add(cls);
    setTimeout(() => overlay.classList.remove(cls), 500);
}

// Flag the current decision — POST to the sidecar (same-origin :8765), which
// persists the exact advise request + advice to advisor.db so a bad decision can
// be reproduced later (no screenshots). Flashes green on save, red if nothing was
// captured yet.
function flagDecision(btn) {
    fetch('/flag-decision', { method: 'POST' })
        .then(r => r.json())
        .then(d => {
            const overlay = document.getElementById('overlay');
            const ok = d && d.saved;
            if (ok && btn) btn.classList.add('sent');
            const cls = ok ? 'feedback-good' : 'feedback-bad';
            overlay.classList.add(cls);
            setTimeout(() => overlay.classList.remove(cls), 600);
        })
        .catch(() => {});
}

function showDebrief(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('no-match');
    const result = data?.result || '?';
    const resultColor = result === 'Win' ? '#81c784' : '#ef5350';

    // Hide game elements, show debrief
    document.getElementById('opp-line').style.display = 'none';
    document.getElementById('key-play').style.display = 'none';
    document.getElementById('threat-line').classList.remove('visible');
    document.getElementById('do-now').classList.remove('visible');
    document.getElementById('phase-line').textContent = '';

    const debrief = document.getElementById('debrief');
    debrief.innerHTML = `
        <div style="font-size:18px;font-weight:700;color:${resultColor}">${result}</div>
        <div style="font-size:11px;color:#888;margin-top:4px">Match complete</div>
        <div style="margin-top:8px;font-size:11px">
            <a href="http://localhost:8765/review" target="_blank"
               style="color:#90caf9;text-decoration:none">
                Open Post-Game Review →
            </a>
        </div>
    `;
    debrief.style.display = 'block';

    // Auto-hide after 15 seconds → the 2s tick then shows the session record
    // (it no longer re-adds `no-match`, which used to hide the record too and
    // could blank the NEXT match if it started within 15s).
    setTimeout(() => {
        debrief.style.display = 'none';
        document.getElementById('opp-line').style.display = '';
    }, 15000);
}

function resetOverlay() {
    inMatch = false;
    document.getElementById('key-play').style.display = 'none';
    document.getElementById('threat-line').classList.remove('visible');
    document.getElementById('do-now').classList.remove('visible');
    document.getElementById('debrief').style.display = 'none';
    document.getElementById('opp-line').style.display = '';
    document.getElementById('opp-line').innerHTML =
        '<span class="waiting" id="waiting-msg">Waiting for match...</span>';
    document.getElementById('phase-line').textContent = '';
}

connect();

// ─── Reposition overlay with Option + Arrow keys ───
// Option + arrows = 10px, Option + Shift + arrows = 50px
function moveOverlay(dx, dy) {
    const el = document.getElementById('overlay');
    const curX = parseInt(el.style.left) || 8;
    const curY = parseInt(el.style.top) || 8;
    el.style.left = (curX + dx) + 'px';
    el.style.top = (curY + dy) + 'px';
    localStorage.setItem('overlay-x', el.style.left);
    localStorage.setItem('overlay-y', el.style.top);
}

// ─── Peek (hover-shrink) ───────────────────────────────────────────────
// The overlay window is a fullscreen, click-through, transparent surface, so the
// webview never receives mouse events (they pass through to MTGA). The native
// layer forwards the cursor position (in CSS px from the window's top-left) via
// `overlayCursor()`; JS owns the geometry and toggles `.peek` (CSS shrinks the
// panel). Also exposed as `togglePeek()` for a native key shortcut.
let peekActive = false;
function setPeek(on) {
    if (feedbackMode) on = false;   // keep the full panel + buttons while giving feedback
    if (on === peekActive) return;
    peekActive = on;
    document.getElementById('overlay').classList.toggle('peek', on);
}
// Cache the full (un-peeked) layout box and keep using it while peeked: the pill
// collapses the layout, so re-measuring live would shrink the trigger region and
// oscillate. offset* is viewport-relative (#overlay has no positioned ancestor),
// matching the CSS-px coords the native layer forwards.
let peekRect = null;
function measurePeekRect() {
    const el = document.getElementById('overlay');
    if (el) peekRect = { l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
}
function togglePeek() {
    if (!peekActive) measurePeekRect();   // capture the box BEFORE the pill collapses it
    setPeek(!peekActive);
}
function overlayCursor(x, y) {
    const el = document.getElementById('overlay');
    if (!el || el.classList.contains('hidden') || el.classList.contains('no-match')) {
        setPeek(false);
        return;
    }
    if (!peekActive) measurePeekRect();
    const r = peekRect;
    if (!r) return;                        // never measured yet — nothing to hit-test
    const M = 6;
    setPeek(x >= r.l - M && x <= r.l + r.w + M && y >= r.t - M && y <= r.t + r.h + M);
}

// ─── Drag to move (in feedback mode) ───────────────────────────────────
// The overlay is click-through, so it only receives real mouse events while
// feedback mode is active (Right ⌘ / Right Win makes the window interactive).
// There you can drag the panel to reposition it; the position persists just like
// the Option+arrow nudge. Clicks on the ✓/✗/⚑ buttons are left alone.
// Module-scoped so a feedback-mode transition can cancel a drag that never saw its
// mouseup (e.g. the modifier key released before the mouse button) — otherwise the
// stale drag would jump the panel on the next feedback re-entry.
let overlayDragging = false;
function cancelOverlayDrag() {
    overlayDragging = false;
    document.getElementById('overlay').classList.remove('dragging');
}
(function setupDrag() {
    const el = document.getElementById('overlay');
    let startX = 0, startY = 0, startL = 0, startT = 0;
    el.addEventListener('mousedown', (e) => {
        if (!feedbackMode || e.button !== 0) return;
        if (e.target.closest('.fb-btn')) return;   // let button clicks through
        overlayDragging = true;
        startX = e.clientX; startY = e.clientY;
        startL = el.offsetLeft; startT = el.offsetTop;
        el.classList.add('dragging');
        e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
        if (!overlayDragging) return;
        // Clamp so a corner always stays on-screen (don't lose the panel off-edge).
        const maxL = window.innerWidth - 40, maxT = window.innerHeight - 24;
        el.style.left = Math.max(0, Math.min(maxL, startL + e.clientX - startX)) + 'px';
        el.style.top = Math.max(0, Math.min(maxT, startT + e.clientY - startY)) + 'px';
    });
    window.addEventListener('mouseup', () => {
        if (!overlayDragging) return;
        overlayDragging = false;
        el.classList.remove('dragging');
        localStorage.setItem('overlay-x', el.style.left);
        localStorage.setItem('overlay-y', el.style.top);
    });
})();

// Restore saved position
(function() {
    const el = document.getElementById('overlay');
    const savedX = localStorage.getItem('overlay-x');
    const savedY = localStorage.getItem('overlay-y');
    if (savedX) el.style.left = savedX;
    if (savedY) el.style.top = savedY;
})();

// Platform-aware control hint — feedback key is Left ⌘ on macOS, Left Ctrl on Windows.
(function() {
    const key = /Mac/i.test(navigator.userAgent) ? 'Left ⌘' : 'Left Ctrl';
    const h = document.getElementById('hint-line');
    if (h) h.textContent = `${key}: feedback + drag to move · hover to hide`;
})();
</script>
