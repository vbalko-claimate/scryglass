<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scryglass — Initializing Engine</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, rgba(91, 108, 207, 0.15) 0%, var(--bg) 75%);
    }
    .loading-card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 36px 28px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(91, 108, 207, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error-log {
      font-family: 'SF Mono', ui-monospace, Menlo, Monaco, monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: var(--radius-md);
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="glass-card loading-card">
    <!-- Brand Mark -->
    <div class="brand-icon" style="width:52px; height:52px; font-size:26px; margin:0 auto 16px auto; box-shadow:var(--shadow-glow);">◈</div>

    <h2 style="font-size:20px; font-weight:800; color:#fff; margin-bottom:6px;">Initializing Scryglass</h2>
    <p style="font-size:12px; color:var(--muted); margin-bottom:6px;" id="staged-status-text">
      Connecting to local Advisor engine...
    </p>
    <!-- Per-attempt detail line (mirrors the current page's detail text) -->
    <p style="font-size:11px; color:var(--muted); min-height:14px; margin-bottom:16px;" id="detail"></p>

    <!-- Animated Spinner -->
    <div class="spinner" id="loading-spinner"></div>

    <!-- Progress Fill Bar -->
    <div class="progress-bar" style="margin-bottom:20px;"><div id="loading-progress" class="progress-fill" style="width:35%;"></div></div>

    <!-- Staged Status Steps -->
    <div style="display:flex; flex-direction:column; gap:6px; font-size:12px; text-align:left; background:var(--bg); padding:12px; border-radius:var(--radius-md); border:1px solid var(--border); margin-bottom:20px;">
      <div id="step-1" style="color:var(--text);">● Contacting Advisor engine (/health)</div>
      <div id="step-2" style="color:var(--muted);">○ Loading card database</div>
      <div id="step-3" style="color:var(--muted);">○ Verifying engine health</div>
      <div id="step-4" style="color:var(--muted);">○ Opening Live Advisor UI</div>
    </div>

    <!-- Error State Controls (Hidden by default) -->
    <div id="error-controls" style="display:none; flex-direction:column; gap:10px;">
      <div class="banner-alert banner-lethal" style="font-size:12px; justify-content:center;">
        ❌ Server failed to start — /health endpoint unreachable
      </div>
      <div id="error-log"></div>
      <div style="display:flex; gap:8px;">
        <button id="btn-retry" class="btn btn-primary btn-sm" style="flex:1;">Retry</button>
        <a id="btn-open-setup" href="/setup" target="_blank" class="btn btn-secondary btn-sm" style="flex:1;">Open Setup</a>
        <button id="btn-copy-log" class="btn btn-ghost btn-sm" style="flex:1;">Copy Log</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const SERVER = 'http://localhost:8765';
      const MAX_WAIT = 45;
      let attempt = 0;
      let logs = [];

      const statusEl = document.getElementById('staged-status-text');
      const detailEl = document.getElementById('detail');
      const progressEl = document.getElementById('loading-progress');
      const spinnerEl = document.getElementById('loading-spinner');
      const errorControls = document.getElementById('error-controls');
      const errorLogEl = document.getElementById('error-log');
      const step1 = document.getElementById('step-1');
      const step2 = document.getElementById('step-2');
      const step3 = document.getElementById('step-3');
      const step4 = document.getElementById('step-4');

      function log(msg) {
        logs.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
        detailEl.textContent = msg;
      }

      function setStep(el, state, text) {
        const map = {
          done: ['var(--success)', '✓'],
          active: ['var(--text)', '●'],
          pending: ['var(--muted)', '○']
        };
        const [color, mark] = map[state];
        el.style.color = color;
        el.textContent = mark + ' ' + text;
      }

      async function checkServer() {
        attempt++;
        log(`Health check #${attempt}...`);
        progressEl.style.width = Math.min(35 + attempt * 2, 92) + '%';

        try {
          const res = await fetch(`${SERVER}/health`, { signal: AbortSignal.timeout(3000) });
          if (res.ok) {
            const data = await res.json();
            log(`Server ready: engine ${data.engine_version}, ${data.card_count} cards`);
            statusEl.textContent = 'Ready!';
            progressEl.style.width = '100%';
            setStep(step1, 'done', 'Advisor engine connected');
            setStep(step2, 'done', `Card Database loaded (${(data.card_count || 0).toLocaleString()} cards)`);
            setStep(step3, 'done', 'Engine /health verified');
            setStep(step4, 'active', 'Opening Live Advisor UI...');
            // Redirect to main UI
            setTimeout(() => { window.location.href = SERVER; }, 500);
            return;
          }
        } catch (e) {
          // Not ready yet
        }

        if (attempt >= MAX_WAIT) {
          showError();
          return;
        }

        // Update staged status message (thresholds preserved from current page).
        if (attempt < 5) {
          statusEl.textContent = 'Starting server...';
          setStep(step1, 'active', 'Contacting Advisor engine (/health)');
        } else if (attempt < 15) {
          statusEl.textContent = 'Loading card database...';
          setStep(step1, 'done', 'Advisor engine reachable');
          setStep(step2, 'active', 'Loading card database');
        } else if (attempt < 30) {
          statusEl.textContent = 'Almost ready...';
          setStep(step2, 'done', 'Card database loading');
          setStep(step3, 'active', 'Verifying engine health');
        } else {
          statusEl.textContent = 'Taking longer than usual...';
          setStep(step3, 'active', 'Verifying engine health');
        }

        setTimeout(checkServer, 1000);
      }

      function showError() {
        spinnerEl.style.display = 'none';
        statusEl.textContent = 'Failed to start';
        detailEl.textContent = '';
        errorControls.style.display = 'flex';
        errorLogEl.textContent = logs.join('\n') +
          '\n\nPossible causes:\n' +
          '- Python sidecar failed to start\n' +
          '- Port 8765 is already in use\n' +
          '- Missing dependencies\n' +
          '- MTGA data directory not found';
      }

      function retry() {
        errorControls.style.display = 'none';
        spinnerEl.style.display = '';
        attempt = 0;
        logs = [];
        progressEl.style.width = '35%';
        statusEl.textContent = 'Starting server...';
        detailEl.textContent = '';
        setStep(step1, 'active', 'Contacting Advisor engine (/health)');
        setStep(step2, 'pending', 'Loading card database');
        setStep(step3, 'pending', 'Verifying engine health');
        setStep(step4, 'pending', 'Opening Live Advisor UI');
        checkServer();
      }

      function copyLog() {
        navigator.clipboard.writeText(logs.join('\n')).then(() => {
          alert('Log copied to clipboard');
        });
      }

      document.getElementById('btn-retry').addEventListener('click', retry);
      document.getElementById('btn-copy-log').addEventListener('click', copyLog);
      // "Open Setup" is an <a href="/setup" target="_blank"> — opens /setup in a
      // new tab, matching the current page's window.open(SERVER + '/setup', '_blank').

      // Start checking
      checkServer();
    })();
  </script>
</body>
</html>
