<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scryglass — Post-Game Replay & Review</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Shell Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon"><span class="brand-mark">◈</span></div>
        <span>Scryglass</span>
      </div>

      <nav class="main-nav">
        <a href="/" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3v6z"/></svg>
          Advisor
        </a>
        <a href="/stats" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          Stats
        </a>
        <a href="/review" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
          Review
        </a>
        <a href="/manage" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Manage
        </a>
      </nav>

      <!-- Account / Identity Shell Control -->
      <div class="account-control">
        <div id="account-pill" class="account-pill">
          <span class="user-avatar">?</span>
          <div style="display:flex; flex-direction:column;">
            <span class="account-email">Checking status...</span>
            <span class="account-anon-hint">syncing anonymously</span>
          </div>
        </div>

        <div id="account-dropdown" class="account-dropdown">
          <div class="dropdown-user-info">
            <span id="dropdown-email-display" class="dropdown-email">planeswalker@scryglass.gg</span>
            <div class="dropdown-badges">
              <span id="dropdown-alpha-badge" class="badge-alpha">ALPHA</span>
              <span class="badge badge-success">ACTIVE</span>
            </div>
          </div>
          <div class="sync-status-row">
            <span><span class="sync-dot"></span>Cloud Sync</span>
            <span id="sync-time-text">Synced 2m ago</span>
          </div>
          <div class="dropdown-actions">
            <button id="btn-cloud-sync" class="btn btn-secondary btn-sm">⚡ Sync now</button>
            <button id="btn-cloud-signout" class="btn btn-ghost btn-sm" style="color:var(--error);">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Body -->
    <main class="page-body">
      <div class="grid grid-1-2">
        <!-- Match Selector Sidebar (Last 10 Matches) -->
        <div style="display:flex; flex-direction:column; gap:12px;">
          <h2 style="font-size:16px; font-weight:700; color:#fff;">Recent Matches (Last 10)</h2>
          <div style="display:flex; flex-direction:column; gap:8px;" id="match-selector-list">
            <div class="glass-card" style="color:var(--muted); font-size:12px; text-align:center;">Loading matches…</div>
          </div>
        </div>

        <!-- Main Turn-by-Turn Replay Workspace -->
        <div style="display:flex; flex-direction:column; gap:16px;" id="review-content">
          <div class="glass-card" style="text-align:center; color:var(--muted); padding:40px;">Loading latest match…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/shell.js"></script>
  <script>
  // ---------------------------------------------------------------------------
  // Post-Game Review — real data wired to the new design.
  // Endpoints: /api/review/matches , /api/review/latest , /api/review/{id}
  // ---------------------------------------------------------------------------
  let currentFilter = 'key';   // 'key' | 'all'
  let currentMatchId = null;
  let currentData = null;
  let matchListCache = [];

  const RESULT_MAP = {
    Win:  { label: 'VICTORY', cls: 'badge-success' },
    Loss: { label: 'DEFEAT',  cls: 'badge-error' },
  };
  const PHASE_MAP = { 'Phase_Main1': 'Main 1', 'Phase_Main2': 'Main 2', 'Phase_Combat': 'Combat' };
  const PRIORITY_COLOR = { critical: 'var(--error)', high: 'var(--warning)', medium: 'var(--muted)' };

  function esc(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Returns an HTML-safe string.
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d.getTime())) return esc(String(s).split('T')[0] || s);
    return esc(d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
  }

  function fmtDuration(start, end) {
    if (!start || !end) return '';
    const a = new Date(start), b = new Date(end);
    if (isNaN(a.getTime()) || isNaN(b.getTime())) return '';
    let s = Math.round((b - a) / 1000);
    if (s <= 0) return '';
    const m = Math.floor(s / 60); s = s % 60;
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function nicePhase(p) {
    if (!p) return '';
    return PHASE_MAP[p] || String(p).replace(/^Phase_/, '').replace(/_/g, ' ');
  }

  // --- Match list (sidebar) -------------------------------------------------
  async function loadMatchList() {
    const el = document.getElementById('match-selector-list');
    let matches;
    try {
      const res = await fetch('/api/review/matches');
      if (!res.ok) throw new Error('status ' + res.status);
      matches = await res.json();
    } catch (e) {
      el.innerHTML = '<div class="glass-card" style="color:var(--muted); font-size:12px; text-align:center;">Could not load matches.</div>';
      return;
    }
    matchListCache = (matches || []).slice(0, 10);
    if (!matchListCache.length) {
      el.innerHTML = '<div class="glass-card" style="color:var(--muted); font-size:12px; text-align:center;">No matches yet. Play a game first!</div>';
      return;
    }
    el.innerHTML = matchListCache.map(m => {
      const r = RESULT_MAP[m.result] || { label: esc(m.result || '?'), cls: 'badge-muted' };
      return `
        <div class="glass-card match-item" data-match-id="${esc(m.match_id)}" style="cursor:pointer; opacity:0.8;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="badge ${r.cls}">${r.label}</span>
            <span style="font-size:11px; color:var(--muted);">${fmtDate(m.started)}</span>
          </div>
          <strong style="font-size:13px; color:#fff; display:block; margin-top:4px;">vs ${esc(m.opp_deck || 'Unknown')}</strong>
          <div style="font-size:11px; color:var(--muted);">${esc(m.my_deck || 'Unknown')}</div>
        </div>`;
    }).join('');
    highlightActive();
  }

  function highlightActive() {
    document.querySelectorAll('#match-selector-list .match-item').forEach(c => {
      if (c.getAttribute('data-match-id') === currentMatchId) {
        c.style.borderColor = 'var(--accent)';
        c.style.opacity = '1';
      } else {
        c.style.borderColor = '';
        c.style.opacity = '0.8';
      }
    });
  }

  // --- Match review (detail) ------------------------------------------------
  async function loadReview(matchId) {
    currentMatchId = matchId;
    highlightActive();
    const el = document.getElementById('review-content');
    el.innerHTML = '<div class="glass-card" style="text-align:center; color:var(--muted); padding:40px;">Loading…</div>';

    const url = matchId ? `/api/review/${encodeURIComponent(matchId)}` : '/api/review/latest';
    let res = null;
    try { res = await fetch(url); } catch (e) { res = null; }
    if (!res || !res.ok) {
      currentData = null;
      el.innerHTML = '<div class="glass-card" style="text-align:center; color:var(--muted); padding:40px;">No match data found. Play a game first!</div>';
      return;
    }
    currentData = await res.json();
    // /latest resolves to a concrete match_id — sync the sidebar selection.
    currentMatchId = (currentData.match && currentData.match.match_id) || matchId;
    renderReview(currentData);
    highlightActive();
  }

  function setFilter(f) {
    currentFilter = f;
    if (currentData) renderReview(currentData);
  }

  function emptyTimeline(msg) {
    return `<div class="glass-card" style="text-align:center; color:var(--muted); font-style:italic; padding:32px;">${esc(msg)}</div>`;
  }

  function renderReview(data) {
    const el = document.getElementById('review-content');
    const m = data.match || {};
    const keyMoments = data.key_moments || [];
    const r = RESULT_MAP[m.result] || { label: esc(m.result || '?'), cls: 'badge-muted' };
    const titleDeck = `${esc(m.my_deck || 'Unknown')} vs ${esc(m.opp_deck || 'Unknown')}`;
    const dur = fmtDuration(m.started, m.ended);
    const totalTurns = data.total_turns != null ? data.total_turns : 0;
    const totalAdvice = data.total_advice != null ? data.total_advice : 0;

    let html = '';

    // Match header card + summary bar
    html += `<div class="glass-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
        <div>
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="badge ${r.cls}" style="font-size:13px; padding:4px 10px;">${r.label}</span>
            <h2 style="font-size:18px; font-weight:800; color:#fff;">${titleDeck}</h2>
          </div>
          <div style="font-size:12px; color:var(--muted); margin-top:4px;">Match ID: <code>${esc(m.match_id || '?')}</code>${m.started ? ' • ' + fmtDate(m.started) : ''}</div>
        </div>
      </div>

      <div class="grid grid-3" style="background:var(--bg); padding:10px; border-radius:var(--radius-md); border:1px solid var(--border);">
        <div>
          <span style="font-size:11px; color:var(--muted);">Total Turns</span>
          <div style="font-weight:700; color:#fff;">${totalTurns}${dur ? ` <span style="font-weight:400; color:var(--muted); font-size:12px;">(${dur})</span>` : ''}</div>
        </div>
        <div>
          <span style="font-size:11px; color:var(--muted);">Key Moments</span>
          <div style="font-weight:700; color:var(--warning);">${keyMoments.length} Pivotal Turn${keyMoments.length === 1 ? '' : 's'}</div>
        </div>
        <div>
          <span style="font-size:11px; color:var(--muted);">Heuristic Advice Count</span>
          <div style="font-weight:700; color:var(--success);">${totalAdvice} Advice Item${totalAdvice === 1 ? '' : 's'}</div>
        </div>
      </div>
    </div>`;

    // Filter bar
    html += `<div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:15px; font-weight:700; color:#fff;">Turn-by-Turn Replay Timeline</h3>
      <div style="display:flex; gap:6px; background:var(--card); padding:3px; border-radius:var(--radius-md); border:1px solid var(--border);">
        <button id="filter-all" class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-ghost'} btn-sm">All Turns</button>
        <button id="filter-key" class="btn ${currentFilter === 'key' ? 'btn-primary' : 'btn-ghost'} btn-sm">Key Moments Only</button>
      </div>
    </div>`;

    // Turn timeline feed
    html += `<div style="display:flex; flex-direction:column; gap:12px;" id="timeline-feed">`;
    if (currentFilter === 'key') {
      if (!keyMoments.length) {
        html += emptyTimeline('No key moments detected in this match.');
      } else {
        for (const km of keyMoments) {
          html += renderTurnCard(km.turn, km.advice || [], true, km.all_advice_count);
        }
      }
    } else {
      const turns = data.turns || {};
      const entries = Object.entries(turns);
      if (!entries.length) {
        html += emptyTimeline('No advice recorded for this match.');
      } else {
        for (const [turnNum, advices] of entries) {
          const t = parseInt(turnNum, 10);
          const isKey = keyMoments.some(k => k.turn === t);
          html += renderTurnCard(t, advices || [], isKey);
        }
      }
    }
    html += `</div>`;

    el.innerHTML = html;

    // Wire filter buttons (they are re-created on every render).
    const bAll = el.querySelector('#filter-all');
    const bKey = el.querySelector('#filter-key');
    if (bAll) bAll.addEventListener('click', () => setFilter('all'));
    if (bKey) bKey.addEventListener('click', () => setFilter('key'));
  }

  function renderTurnCard(turn, advices, isKey, allCount) {
    advices = advices || [];
    // Key-moment cards show their (backend-capped top-3) advice in full; All view caps at 5.
    const shown = isKey ? advices : advices.slice(0, 5);

    const hasCritical = advices.some(a => a && a.priority === 'critical');

    let border, titleColor, bg, badgeCls, badgeText;
    if (isKey) {
      if (hasCritical) {
        border = 'var(--error)'; titleColor = 'var(--error)'; bg = 'rgba(217, 115, 122, 0.08)';
        badgeCls = 'badge-error'; badgeText = 'CRITICAL';
      } else {
        border = 'var(--warning)'; titleColor = 'var(--warning)'; bg = 'rgba(224, 160, 96, 0.08)';
        badgeCls = 'badge-warning'; badgeText = 'PIVOTAL';
      }
    } else {
      border = 'var(--accent)'; titleColor = '#fff'; bg = '';
      badgeCls = 'badge-muted';
      badgeText = `${advices.length} ADVICE`;
    }

    const turnLabel = turn === 0 ? 'Mulligan (T0)' : `Turn ${turn}`;
    const pivSuffix = isKey ? ' (Pivotal Moment)' : '';

    let html = `<div class="glass-card" style="border-left:4px solid ${border};${bg ? ' background:' + bg + ';' : ''}">`;
    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong style="color:${titleColor}; font-size:14px;">${turnLabel}${pivSuffix}</strong>
      <span class="badge ${badgeCls}">${badgeText}</span>
    </div>`;

    if (!shown.length) {
      html += `<div style="font-size:12px; color:var(--muted);">No advice recorded this turn.</div>`;
    }
    for (const a of shown) {
      html += renderAdvice(a);
    }

    if (!isKey && advices.length > shown.length) {
      html += `<div style="font-size:11px; color:var(--muted); padding-left:12px; margin-top:2px;">+${advices.length - shown.length} more</div>`;
    }
    if (isKey && allCount && allCount > advices.length) {
      html += `<div style="font-size:11px; color:var(--muted); padding-left:12px; margin-top:2px;">Top ${advices.length} of ${allCount} advice this turn</div>`;
    }

    html += `</div>`;
    return html;
  }

  function renderAdvice(a) {
    if (!a) return '';
    const priColor = PRIORITY_COLOR[a.priority] || 'var(--muted)';
    const phase = nicePhase(a.phase);
    let html = `<div style="padding:5px 0 5px 10px; border-left:2px solid ${priColor}; margin-bottom:4px; font-size:12px; color:var(--text); line-height:1.5;">`;
    if (phase) {
      html += `<span style="display:inline-block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-right:6px;">${esc(phase)}</span>`;
    }
    html += esc(a.message);
    if (a.source) {
      html += `<span style="font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-left:6px; opacity:0.7;">${esc(a.source)}</span>`;
    }
    html += `</div>`;
    return html;
  }

  // --- Wiring ---------------------------------------------------------------
  document.getElementById('match-selector-list').addEventListener('click', (ev) => {
    const card = ev.target.closest('.match-item');
    if (!card) return;
    loadReview(card.getAttribute('data-match-id'));
  });

  // Populate the sidebar and load the latest match on page load.
  loadMatchList();
  loadReview(null);
  </script>
</body>
</html>
