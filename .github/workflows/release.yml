name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# All-Rust product: the backend is `glass-host` (crate glass-mtga) and the
# advice engine is `glass-server` (crate glass-server), both built from the
# sibling repo glass-shard. There is no Python sidecar anymore — the former
# `build-sidecar` (PyInstaller) and `ci-check` (advisor.ci_check) jobs were
# removed when the Python host was parked under legacy-python/.
#
# NOTE: Windows is intentionally absent from the build matrix. The previous
# Windows release shipped a Python scry-server; with Python retired, Windows
# needs glass-shard to build glass-host on x86_64-pc-windows-msvc (log paths,
# sidecar features) — re-enable the Windows matrix entry only after verifying
# `cargo build -p glass-mtga --features server` succeeds on Windows.
jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ../glass-shard

      # Check out the sibling Rust repo that owns the backend + advice engine.
      - name: Checkout glass-shard (sidecar source)
        uses: actions/checkout@v4
        with:
          repository: vbalko-claimate/glass-shard
          path: glass-shard

      - name: Build Rust sidecars (glass-host + glass-server)
        run: |
          cd glass-shard
          cargo build -p glass-mtga --features server --release --bin glass-host
          cargo build -p glass-server --release
          cd ..
          mkdir -p src-tauri/binaries
          cp glass-shard/target/release/glass-host src-tauri/binaries/glass-host-${{ matrix.target }}
          cp glass-shard/target/release/glass-server src-tauri/binaries/glass-server-${{ matrix.target }}
          chmod +x src-tauri/binaries/*

      - name: Compile card DB (glass_advise_db.json)
        run: |
          DB_SRC="glass-shard/data/cards/standard_oracle_plus.json"
          [ -f "$DB_SRC" ] || DB_SRC="glass-shard/data/cards/standard_oracle.json"
          mkdir -p src-tauri/resources
          (cd glass-shard && cargo run -q -p glass-cli --release -- \
            compile-cards --input "$DB_SRC" --output ../src-tauri/resources/glass_advise_db.json)

      # overlay-helper placeholder per-platform (macOS builds it separately; CI
      # stub for now to satisfy externalBin — replace with a real build if needed).
      - name: Stage overlay-helper
        run: |
          if [ ! -f src-tauri/binaries/overlay-helper-${{ matrix.target }} ]; then
            echo "overlay-helper not staged — creating placeholder" > src-tauri/binaries/overlay-helper-${{ matrix.target }}
          fi

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: skip Apple signing for now (no $99 cert yet)
          # Set these secrets when you have an Apple Developer account:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Scryglass ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG](https://github.com/vbalko-claimate/scryglass/commits/${{ github.ref_name }}) for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
