name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# All-Rust product: the backend is `glass-host` (crate glass-mtga) and the
# advice engine is `glass-server` (crate glass-server), both built from the
# sibling repo glass-shard. There is no Python sidecar anymore — the former
# `build-sidecar` (PyInstaller) and `ci-check` (advisor.ci_check) jobs were
# removed when the Python host was parked under legacy-python/.
#
# Windows re-enabled 2026-07-06 for the beta: glass-host's MTGA log path now has
# a Windows branch (default_log_path) and rusqlite uses the `bundled` SQLite, so
# `cargo build -p glass-mtga --features server` builds on x86_64-pc-windows-msvc.
# Windows uses a Tauri overlay window (no Swift overlay-helper — a placeholder
# satisfies externalBin). The run steps below are bash (see defaults.run.shell)
# so they work on both GitHub-hosted macOS and Windows runners.
jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ../glass-shard

      # ★ WHICH ENGINE SHA THIS RELEASE CONTAINS — read from a file the release commit sets.
      #
      # ⚠ THE BUG THIS FIXES, found in a pre-release review (2026-08-10): this step used to have no
      # `ref:`, so each matrix job checked out glass-shard's DEFAULT-BRANCH HEAD independently. Two
      # consequences, both silent: a commit landing on glass-shard `main` between the macOS job and
      # the Windows job made the two platforms ship DIFFERENT engines, and nothing recorded which
      # SHA any release actually contained — so "we reviewed X and released it" was never verifiable.
      #
      # `.glass-shard-sha` lives in THIS repo, so the pin is part of the same commit as the version
      # bump and the changelog: one commit says "this app version contains that engine".
      - name: Resolve the pinned glass-shard SHA
        id: pin
        run: |
          test -f .glass-shard-sha || { echo "::error::.glass-shard-sha is missing"; exit 1; }
          sha="$(tr -d '[:space:]' < .glass-shard-sha)"
          case "$sha" in
            ????????????????????????????????????????) ;;
            *) echo "::error::.glass-shard-sha must be a full 40-char commit sha, got '$sha'"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned glass-shard to $sha"

      # Check out the sibling Rust repo that owns the backend + advice engine.
      - name: Checkout glass-shard (sidecar source)
        uses: actions/checkout@v4
        with:
          repository: vbalko-claimate/glass-shard
          # glass-shard is private; the default GITHUB_TOKEN is scoped to
          # scryglass only. GLASS_SHARD_PAT is a token with read access to it.
          token: ${{ secrets.GLASS_SHARD_PAT }}
          path: glass-shard
          ref: ${{ steps.pin.outputs.sha }}

      # Fail loudly rather than silently shipping a different engine: `build.rs` bakes
      # `GLASS_GIT_SHA` from the checkout's git HEAD, so this is the same value the running app
      # reports back in its match rows.
      - name: Verify the engine checkout matches the pin
        run: |
          got="$(cd glass-shard && git rev-parse HEAD)"
          want="${{ steps.pin.outputs.sha }}"
          if [ "$got" != "$want" ]; then
            echo "::error::glass-shard checkout is $got, expected $want"
            exit 1
          fi
          echo "engine SHA verified: $got"

      - name: Build Rust sidecars (glass-host + glass-server)
        run: |
          cd glass-shard
          cargo build -p glass-mtga --features server --release --bin glass-host
          cargo build -p glass-server --release
          cd ..
          mkdir -p src-tauri/binaries
          cp glass-shard/target/release/glass-host src-tauri/binaries/glass-host-${{ matrix.target }}
          cp glass-shard/target/release/glass-server src-tauri/binaries/glass-server-${{ matrix.target }}
          chmod +x src-tauri/binaries/*

      - name: Compile card DB (glass_advise_db.json)
        run: |
          # The compiled advise DB is committed (src-tauri/resources/). The oracle
          # source is a gitignored 23MB Scryfall artifact, so it's normally absent
          # in CI → ship the committed DB. If the oracle IS present (local/future
          # fetch), recompile it fresh so it can't drift.
          mkdir -p src-tauri/resources
          DB_SRC="glass-shard/data/cards/standard_oracle_plus.json"
          [ -f "$DB_SRC" ] || DB_SRC="glass-shard/data/cards/standard_oracle.json"
          if [ -f "$DB_SRC" ]; then
            echo "oracle present → recompiling advise DB from $DB_SRC"
            (cd glass-shard && cargo run -q -p glass-cli --release -- \
              compile-cards --input "$DB_SRC" --output ../src-tauri/resources/glass_advise_db.json)
          elif [ -f src-tauri/resources/glass_advise_db.json ]; then
            echo "oracle absent → using committed src-tauri/resources/glass_advise_db.json"
          else
            echo "::error::no oracle source AND no committed advise DB — cannot produce glass_advise_db.json"
            exit 1
          fi

      - name: Stage deck catalogue (belief prior)
        run: |
          # The belief engine's prior over opponent decklists. glass-shard owns the
          # catalogue, so prefer the freshly-checked-out copy and fall back to the
          # committed one — same policy as the advise DB above. A MISSING catalogue is
          # not fatal: glass-host then logs "opponent model OFF" and behaves as it did
          # before the belief shipped.
          mkdir -p src-tauri/resources/deck_catalog
          if compgen -G "glass-shard/data/meta/deck_catalog/*.json" > /dev/null; then
            # CLEAR FIRST. `cp` never removes, so stale months would accumulate in every
            # bundle forever — and the host picks the lexically greatest YYYY-MM.json, so a
            # stale file is harmless only until someone adds a differently-named one.
            rm -f src-tauri/resources/deck_catalog/*.json
            cp glass-shard/data/meta/deck_catalog/*.json src-tauri/resources/deck_catalog/
            echo "catalogue(s) staged from glass-shard:"
          else
            echo "glass-shard catalogue absent → using the committed copy:"
          fi
          ls -la src-tauri/resources/deck_catalog/ || echo "  (none — belief will be off)"

      - name: Gate — the shipped catalogue must build a prior against the shipped advise DB
        run: |
          # The belief fails CLOSED, so a mismatched pair does not break the build — it ships an
          # app that logs "opponent model OFF" and keeps advising. Indistinguishable from a
          # belief that loaded and found nothing; the same shape as the 2026-07-06
          # Marvel-blindness incident. Until this step existed, check_belief_prior.sh was a
          # manual script that gated nothing (review finding, 2026-07-27).
          #
          # Non-fatal when the catalogue is absent — that is a deliberate degrade, not a defect.
          # CALL THE SCRIPT, do not re-implement it. The first version inlined the example and
          # left `check_belief_prior.sh` referenced by nothing but a comment — two copies of a
          # gate that can drift, while the commit message claimed the script was now called.
          # It also picked `ls | sort | tail -1` over ALL json, where the RUNTIME filters to
          # exactly `YYYY-MM.json`: staging `standard_arena_current.json` alongside `2026-07.json`
          # made the gate validate one file while the app loaded another. The script now owns the
          # selection rule and matches runtime.
          if compgen -G "src-tauri/resources/deck_catalog/*.json" > /dev/null; then
            (cd glass-shard && bash scripts/check_belief_prior.sh \
               "" ../src-tauri/resources/glass_advise_db.json \
               --catalog-dir ../src-tauri/resources/deck_catalog)
          else
            echo "no catalogue staged — belief ships OFF by design, nothing to gate"
          fi

      # overlay-helper placeholder per-platform (macOS builds it separately; CI
      # stub for now to satisfy externalBin — replace with a real build if needed).
      - name: Stage overlay-helper
        run: |
          # Windows uses a Tauri overlay window (no Swift helper), but Tauri's
          # externalBin still requires a file per target — and .exe on Windows.
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          DEST="src-tauri/binaries/overlay-helper-${{ matrix.target }}${EXT}"
          [ -f "$DEST" ] || echo "placeholder — Windows overlay uses a Tauri window" > "$DEST"

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the "## [VERSION] …" section out of CHANGELOG.md (up to the next
          # "## [" heading). This becomes the GitHub release body AND the OTA
          # latest.json `notes`, which the app shows as "What's new" on update.
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="Pre-alpha build — see CHANGELOG.md for details."
          fi
          {
            echo "notes<<__EOF_NOTES__"
            echo "$NOTES"
            echo ""
            echo "— Full changelog: https://github.com/vbalko-claimate/scryglass/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
            echo "__EOF_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: skip Apple signing for now (no $99 cert yet)
          # Set these secrets when you have an Apple Developer account:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Scryglass ${{ github.ref_name }} (pre-alpha)'
          releaseBody: ${{ steps.changelog.outputs.notes }}
          # Draft = a review gate (CI builds it; you click Publish). NOT a
          # prerelease: the OTA updater points at /releases/latest/, and GitHub's
          # "latest" EXCLUDES prereleases — so a prerelease would be invisible to
          # the updater. Publish the draft to make it live for OTA.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
